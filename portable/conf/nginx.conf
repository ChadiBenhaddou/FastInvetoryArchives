# Web server of the portable Windows mode: the launcher fills in the @...@ values and writes the
# result to systeme\nginx\nginx.conf at each start. Same rules as docker/app/nginx.conf, with PHP
# served by several php-cgi processes (php-fpm does not exist on Windows).
worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events { worker_connections 1024; }

http {
    include "@NGINX@/conf/mime.types";
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    upstream php {
@UPSTREAM@
    }

    server {
        # This PC only: never reachable from the network.
        listen 127.0.0.1:@PORT@ default_server;
        server_name _;
        root "@PUBLIC@";
        index index.php;
        charset utf-8;

        client_max_body_size 4096M;
        client_body_timeout 900s;

        # Everything is served from this machine: the CSP forbids loading any
        # script, style, font or image from anywhere else.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;

        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass php;
            # A php-cgi being restarted: the request goes to the next one.
            fastcgi_next_upstream error timeout;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include "@NGINX@/conf/fastcgi_params";
            fastcgi_read_timeout 900s;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        # While PHP (re)starts: a French page that reloads itself.
        error_page 502 503 504 /__starting;
        location = /__starting {
            internal;
            default_type "text/html; charset=utf-8";
            add_header Retry-After 5 always;
            return 503 '<!doctype html><html lang="fr"><meta charset="utf-8"><meta http-equiv="refresh" content="5"><title>Démarrage…</title><body style="font-family:sans-serif;text-align:center;padding-top:20vh;color:#333"><h1>L\'application démarre…</h1><p>Cette page se rechargera toute seule dans quelques secondes.</p></body></html>';
        }
    }
}
