; PHP of the portable Windows mode (copied to runtime\php\php.ini by build.py).
; Same limits as the Docker image (docker/app/php.ini). The launcher writes runtime\php\php.ini at
; each start: this file + an absolute extension_dir (a relative one would be read from the current folder).
expose_php = Off
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
; Export ZIPs from a phone can reach several GB.
upload_max_filesize = 4096M
post_max_size = 4096M
max_file_uploads = 50
date.timezone = UTC
default_charset = "UTF-8"
; Never reaches the network: no remote includes.
allow_url_include = Off
cgi.fix_pathinfo = 0

; bcmath is built in on Windows.
extension = curl
extension = exif
extension = fileinfo
extension = gd
extension = intl
extension = mbstring
extension = openssl
extension = pdo_sqlite
extension = sqlite3
extension = zip
zend_extension = opcache

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; Updates replace app\ while the app is stopped: no need to watch the files.
opcache.validate_timestamps = 0
