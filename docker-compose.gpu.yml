# Optional: use an NVIDIA GPU for the LLM.
# Requires the NVIDIA driver on the PC (Windows: Docker Desktop + WSL2 GPU support;
# Ubuntu: nvidia-container-toolkit). Start the stack with:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# With a GPU the default model extracts a document in a few seconds instead of ~1 minute on CPU.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
