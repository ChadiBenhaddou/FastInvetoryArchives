# Gateway: the only container reachable from the PC. It runs nginx alone (no PHP,
# no data, no volume) and forwards to the app container, which sits on the internal
# network only and therefore has no route outside, whatever the Docker platform.
user www-data;
worker_processes 1;
pid /run/nginx-gateway.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    # Docker's embedded DNS: re-resolve "app" so a restarted app container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 4096M;
        client_body_timeout 900s;
        # Stream uploads straight through instead of spooling them to disk here.
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        location / {
            set $upstream http://app:80;
            proxy_pass $upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
        }

        # While the app (re)starts: a French page that reloads itself.
        error_page 502 503 504 /__starting;
        location = /__starting {
            internal;
            default_type "text/html; charset=utf-8";
            add_header Retry-After 5 always;
            return 503 '<!doctype html><html lang="fr"><meta charset="utf-8"><meta http-equiv="refresh" content="5"><title>Démarrage…</title><body style="font-family:sans-serif;text-align:center;padding-top:20vh;color:#333"><h1>L\'application démarre…</h1><p>Cette page se rechargera toute seule dans quelques secondes.</p></body></html>';
        }
    }

    # Windows OCR (Snipping Tool engine, windows-ocr/): a service on the PC itself, listening on
    # 127.0.0.1:8010 only. The app containers have no route to the PC; this port is how the OCR
    # workers reach it. Not published (only port 80 is): reachable from the Docker networks only.
    # On a PC without that service (Ubuntu), requests fail with 502 and PaddleOCR is used.
    server {
        listen 8010;
        server_name _;

        client_max_body_size 40M;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location = /ocr {
            limit_except POST { deny all; }
            set $windows_ocr http://host.docker.internal:8010;
            proxy_pass $windows_ocr;
            proxy_set_header Connection "";
        }

        location = /health {
            set $windows_ocr http://host.docker.internal:8010;
            proxy_pass $windows_ocr;
            proxy_connect_timeout 3s;
        }

        location / { return 404; }
    }
}
