# Rapid Archive Inventory — full stack on one air-gapped PC.
#
# Network design:
#   - "internal" is a Docker internal network: containers on it have NO route
#     outside the host, even if the PC were ever connected by mistake.
#   - The app itself is on "internal" only. The "gateway" (nginx alone: no PHP, no
#     data, no volume) is the only container also on "frontend", so the web page can
#     be published — on 127.0.0.1 only (never on the LAN).

name: archive-inventory

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Inventaire des archives}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?APP_KEY manquant dans .env}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: http://localhost
  APP_VERSION: ${APP_VERSION:-dev}
  APP_LOCALE: fr
  APP_FALLBACK_LOCALE: en
  SESSION_LIFETIME: 480
  # Must exceed the longest job (a big import may take up to an hour), otherwise
  # the queue would hand the same job to a second worker.
  DB_QUEUE_RETRY_AFTER: 4000
  LOG_CHANNEL: daily
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-archive}
  DB_USERNAME: ${DB_USERNAME:-archive}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
  OCR_URL: http://ocr-worker:8000
  PIPELINE_WORKERS: ${PIPELINE_WORKERS:-2}
  OLLAMA_URL: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b-instruct-q4_K_M}
  EXTRACT_WORKERS: 1
  MEILISEARCH_HOST: http://meilisearch:7700
  MEILISEARCH_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY manquant dans .env}
  ARCHIVE_ROOT: /srv/archive
  # Same folder as seen from Windows/Ubuntu, only used to show paths to the user.
  ARCHIVE_HOST_PATH: ${ARCHIVE_HOST_ROOT}

x-app-common: &app-common
  image: archive-inventory/app:${APP_VERSION:-dev}
  restart: unless-stopped
  volumes:
    # Host folder holding the watched import folder, the images and the backups.
    - ${ARCHIVE_HOST_ROOT:?ARCHIVE_HOST_ROOT manquant dans .env}:/srv/archive
    - app-storage:/var/www/html/storage
  networks: [internal]

services:
  mysql:
    image: mysql:8.4.9
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-archive}
      MYSQL_USER: ${DB_USERNAME:-archive}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant dans .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/archive.cnf:/etc/mysql/conf.d/archive.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [internal]

  meilisearch:
    image: getmeili/meilisearch:v1.54.3
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data/data.ms
      MEILI_DUMP_DIR: /meili_data/dumps
    volumes:
      - meili-data:/meili_data
      # Dumps land next to the backups so the app can put them in the backup folder.
      - ${ARCHIVE_HOST_ROOT}/backups/.search-dumps:/meili_data/dumps
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7700/health || curl -fsS http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]

  app:
    <<: *app-common
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: app
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
    depends_on:
      mysql: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Reverse proxy publishing the app on 127.0.0.1. Same image, nginx only.
  gateway:
    image: archive-inventory/app:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: gateway
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    networks: [internal, frontend]
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 30

  queue:
    <<: *app-common
    environment:
      <<: *app-env
      CONTAINER_ROLE: queue
    depends_on:
      app: { condition: service_healthy }

  scheduler:
    <<: *app-common
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    depends_on:
      app: { condition: service_healthy }

  # Processing pipeline workers: OCR and search indexing, in parallel.
  pipeline:
    <<: *app-common
    environment:
      <<: *app-env
      CONTAINER_ROLE: queue
      QUEUES: ocr,index
    deploy:
      replicas: ${PIPELINE_WORKERS:-2}
    depends_on:
      app: { condition: service_healthy }
      ocr-worker: { condition: service_healthy }

  # LLM extraction: one worker, the model handles one document at a time on CPU.
  extractor:
    <<: *app-common
    environment:
      <<: *app-env
      CONTAINER_ROLE: queue
      QUEUES: extract
    depends_on:
      app: { condition: service_healthy }
      ollama: { condition: service_healthy }

  # Local LLM. Models live in the ollama-models volume, filled on the connected machine
  # (scripts/pull-llm-models) and shipped in the offline bundle. No network access.
  ollama:
    image: ollama/ollama:0.40.8
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "-1"        # keep the model in RAM (reloading costs ~10 s)
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks: [internal]

  # PaddleOCR (Arabic + Latin) + Tesseract, models baked into the image. No network access.
  ocr-worker:
    image: archive-inventory/ocr-worker:${APP_VERSION:-dev}
    build:
      context: ./ocr-worker
      target: base
    restart: unless-stopped
    environment:
      # Each process loads the models (~1 GB RAM) and handles one photo at a time.
      OCR_PROCESSES: ${OCR_PROCESSES:-2}
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-3}
    networks: [internal]

networks:
  internal:
    internal: true
  # Only used by the gateway to publish its port. No masquerading = no route out on a
  # Linux Docker Engine (Docker Desktop ignores this option; the gateway holds no data).
  frontend:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  mysql-data:
  meili-data:
  app-storage:
  ollama-models:
