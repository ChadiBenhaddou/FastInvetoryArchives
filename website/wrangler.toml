# Cloudflare Pages project of the public site (root directory: website/). See docs/DEPLOIEMENT.md.
name = "inventaire-archives-site"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# Lead form storage. Create it once:  npx wrangler d1 create inventaire-archives-leads
# then put the printed database_id here (it is not a secret).
[[d1_databases]]
binding = "LEADS_DB"
database_name = "inventaire-archives-leads"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
