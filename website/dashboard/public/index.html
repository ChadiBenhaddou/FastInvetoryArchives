<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Tableau de bord SEO (privé)</title>
<style>
    :root { --ink: #1c1917; --muted: #78716c; --line: #e7e5e4; --brand: #d97706; --bg: #fafaf9; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    header { background: var(--ink); color: #fff; padding: 12px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 16px; margin: 0; }
    nav button { background: none; border: 0; color: #d6d3d1; padding: 6px 10px; cursor: pointer; font: inherit; border-radius: 6px; }
    nav button[aria-selected="true"] { background: #44403c; color: #fff; }
    main { padding: 20px; max-width: 1400px; margin: auto; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
    input, select, button.action { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    button.action { cursor: pointer; }
    button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
    th { background: #f5f5f4; cursor: pointer; white-space: nowrap; position: sticky; top: 0; }
    .muted { color: var(--muted); }
    .tag { display: inline-block; padding: 1px 6px; border-radius: 10px; background: #f5f5f4; font-size: 12px; }
    .stale { color: #b45309; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .ok { color: #15803d; } .ko { color: #b91c1c; }
    pre { white-space: pre-wrap; font-size: 12px; }
</style>
</head>
<body>
<header>
    <h1>Tableau de bord SEO — privé</h1>
    <nav role="tablist">
        <button role="tab" data-tab="keywords" aria-selected="true">Mots-clés</button>
        <button role="tab" data-tab="planning" aria-selected="false">Planification</button>
        <button role="tab" data-tab="publications" aria-selected="false">Publications</button>
    </nav>
    <span id="meta" class="muted"></span>
</header>
<main id="view"><p>Chargement…</p></main>
<script src="app.js" type="module"></script>
</body>
</html>
